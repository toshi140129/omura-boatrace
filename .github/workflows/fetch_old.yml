name: 2014〜2021年データ取得（参考）

# 6期間に分けて並列取得。1期間あたりの同時接続は本番より少なめ。
# リニューアル（2015-03-28）の前年 2014年〜2021年を半年ずつ取得して data_2014_2021/ に保存する（本番CSVには触れない）。
on:
  push:
    branches: [claude/project-thread-ycnj0s]
    paths: [".github/workflows/fetch_old.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        span:
          - "2014-01-01 2014-06-30"
          - "2014-07-01 2014-12-31"
          - "2015-01-01 2015-06-30"
          - "2015-07-01 2015-12-31"
          - "2016-01-01 2016-06-30"
          - "2016-07-01 2016-12-31"
          - "2017-01-01 2017-06-30"
          - "2017-07-01 2017-12-31"
          - "2018-01-01 2018-06-30"
          - "2018-07-01 2018-12-31"
          - "2019-01-01 2019-06-30"
          - "2019-07-01 2019-12-31"
          - "2020-01-01 2020-06-30"
          - "2020-07-01 2020-12-31"
          - "2021-01-01 2021-06-30"
          - "2021-07-01 2021-12-31"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 requests
      - name: 取得
        run: |
          mkdir work
          cp omura_history_fetch.py omura_extra_fetch.py tools_2022/fetch_chunk.py work/
          cd work && python fetch_chunk.py ${{ matrix.span }}
      - name: 期間名
        id: n
        run: echo "name=$(echo '${{ matrix.span }}' | tr ' ' '_')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ steps.n.outputs.name }}
          path: work/*.csv

  merge:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - run: python tools_2022/merge.py parts data_2014_2021
      - name: ブランチに保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data_2014_2021
          git commit -m "2014〜2021年データ（参考）を追加" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
